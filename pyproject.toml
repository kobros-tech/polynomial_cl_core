[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-cl"
version = "0.1.0"
description = "Research instrument: incremental polynomial feature expansion for continual learning (NumPy only)"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "."]
extend-exclude = ["notebooks", "results", "data"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, flake8-bugbear, pyupgrade and flake8-comprehensions.
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# Long comment and docstring lines are left to the author; ruff-format wraps code.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["polynomial_cl", "experiments"]

[tool.ruff.format]
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Executing the notebooks takes minutes, so it is opt-in: `pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: executes whole notebooks in a clean kernel (minutes); run with `pytest -m slow`"]
